[project]
name = "judaism-llm"
version = "0.1.0"
description = "Fine-tune LLMs on Sefaria Jewish texts"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.scripts]
download-sefaria = "download_sefaria:download_all_texts"
prepare-training = "prepare_training_data:create_training_data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"